id: __JUDGE_NAME__
key: __JUDGE_TOKEN__
# This file is a TEMPLATE, not the real config — `judge/entrypoint.sh` (via
# `judge/render-config.mjs`) renders it into `/judge-config/judge.yml` at
# container start, substituting `__JUDGE_NAME__`/`__JUDGE_TOKEN__` from this
# container's own `JUDGE_NAME`/`JUDGE_TOKEN` environment (Task 13). The real
# credential never gets baked into the image or checked in here.
#
# `judged`'s BridgeServer verifies this `(id, key)` pair against
# `judge_nodes.name` / `judge_nodes.token_hash` before admitting a handshake
# (apps/judged/src/drivers/dmoj/bridge-server.ts, `BridgeOptions.verifyJudge`).
# `scripts/seed-problem.ts` seeds that `judge_nodes` row (name `judge-1`,
# `token_hash = sha256_hex(JUDGE_TOKEN)`) from the same env var — see
# `.env.example`'s `JUDGE_TOKEN` — so the two must agree, or a fresh
# `docker-compose up` rejects this judge and it retries its handshake
# forever.
problem_storage_globs:
  - /problems/*
runtime:
  # Generated by running `dmoj-autoconf -V` inside the image built from
  # judge/Dockerfile — regenerated for F-46 against
  # `localhost/duckoj-judge:f46-probe`, the throwaway tag that first carried
  # Free Pascal and the JDK. Regenerate this block if that base image, or the
  # compiler toolchain installed in it, changes — a stale path here
  # degenerates into a KeyError deep inside judge-server rather than a clear
  # "executor not found".
  #
  # Copied out of autoconf verbatim, INCLUDING `node`: judge-agent's own node
  # binary lives at /usr/local/bin/node (judge/Dockerfile copies it out of the
  # agent-build stage) and autoconf finds it, so the NODEJS executor is
  # configurable in this image. It is deliberately absent from Compose's
  # `--only-executors`, which is what decides what this judge announces, and
  # no `languages` row maps to it. Editing a path out of a generated block by
  # hand is how the KeyError above gets introduced.
  as_x64: /usr/bin/x86_64-linux-gnu-as
  as_x86: /usr/bin/as
  awk: /usr/bin/mawk
  cat: /usr/bin/cat
  fpc: /usr/bin/fpc
  g++: /usr/bin/g++
  g++11: /usr/bin/g++
  g++14: /usr/bin/g++
  g++17: /usr/bin/g++
  g++20: /usr/bin/g++
  gcc: /usr/bin/gcc
  gcc11: /usr/bin/gcc
  java: /usr/lib/jvm/java-17-openjdk-amd64/bin/java
  javac: /usr/lib/jvm/java-17-openjdk-amd64/bin/javac
  ld_x64: /usr/bin/x86_64-linux-gnu-ld
  ld_x86: /usr/bin/ld
  node: /usr/local/bin/node
  python3: /env/bin/python3
  sed: /usr/bin/sed
