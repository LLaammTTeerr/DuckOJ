id: judge-1
key: phase1-judge-key
# The judge's own key check is decorative in Phase 1 — `judged`'s
# BridgeServer accepts any handshake and never verifies it
# (apps/judged/src/drivers/dmoj/bridge-server.ts:73-76). Network isolation
# (judged's port is never published to the host — see docker-compose.yml) is
# the only real control; don't treat this key as one.
problem_storage_globs:
  - /problems/*
runtime:
  # Generated by running `dmoj-autoconf -V` inside the qhhoj-judge:dev image
  # built from judge/Dockerfile (python:3.11-slim-bookworm base). Regenerate
  # this block if that base image, or the compiler toolchain installed in it,
  # changes — a stale path here degenerates into a KeyError deep inside
  # judge-server rather than a clear "executor not found".
  as_x64: /usr/bin/x86_64-linux-gnu-as
  as_x86: /usr/bin/as
  awk: /usr/bin/mawk
  cat: /usr/bin/cat
  g++: /usr/bin/g++
  g++11: /usr/bin/g++
  g++14: /usr/bin/g++
  g++17: /usr/bin/g++
  g++20: /usr/bin/g++
  gcc: /usr/bin/gcc
  gcc11: /usr/bin/gcc
  ld_x64: /usr/bin/x86_64-linux-gnu-ld
  ld_x86: /usr/bin/ld
  python3: /env/bin/python3
  sed: /usr/bin/sed
