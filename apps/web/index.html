<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` is load-bearing, not cosmetic: without it
         `env(safe-area-inset-bottom)` always resolves to 0, and the phone
         shell nav (a fixed glass bar at the bottom edge — app.css's
         `@media (max-width: 700px)` block, D67) sits under the home
         indicator on every notched phone. `initial-scale=1` with no
         `maximum-scale`/`user-scalable` so pinch-zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The chrome around the page follows the scheme the stylesheet does. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Theme, applied BEFORE first paint (D116). A blocking inline script,
         not `main.tsx`: the CSS `--bg` wash paints the moment the stylesheet
         loads, which is before the deferred module runs, so reading the
         choice here is what avoids a light-then-dark flash. `data-theme` is
         set only for an explicit "light"/"dark"; "system" (or nothing stored,
         or storage that throws in a locked-down webview) leaves the attribute
         off so `prefers-color-scheme` decides. Kept in sync with
         `src/theme.tsx` — `test/theme.spec.tsx` runs this exact script. -->
    <script>
      try {
        var duckojTheme = localStorage.getItem('duckoj.theme');
        if (duckojTheme === 'light' || duckojTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', duckojTheme);
        }
      } catch (e) {
        /* storage blocked — fall back to the OS scheme */
      }
    </script>
    <title>DuckOJ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
