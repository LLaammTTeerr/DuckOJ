# Runbook note: Caddy serves ./apps/web/dist as a bind mount (read-only). Build the
# SPA before bringing the stack up, or Caddy will serve an empty/missing directory:
#   corepack pnpm --filter @duckoj/web exec vite build
#
# MinIO is intentionally not defined here — it arrives in Phase 2.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: duckoj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: duckoj
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duckoj']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    # Invoke the already-installed tsx binary directly, bypassing pnpm/corepack.
    # The `deps`/`build` stages run as root, so any corepack cache they populate
    # lives under /root and is never carried into the runtime image; the `node`
    # user has a different $HOME regardless. Going through `pnpm` here would make
    # every migrate-container start reach out to the npm registry to re-fetch the
    # pinned pnpm version. This path has no such dependency — verified with
    # `podman run --network none` (see task-15-report.md).
    command: ['packages/db/node_modules/.bin/tsx', 'scripts/migrate.ts']
    environment:
      DATABASE_URL: postgres://duckoj:${POSTGRES_PASSWORD}@postgres:5432/duckoj
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://duckoj:${POSTGRES_PASSWORD}@postgres:5432/duckoj
      # Required since Task 11 (the WebSocket gateway's Redis subscriber needs
      # it) — this was a known, deliberately-deferred gap until this task
      # added the `redis` service (see task-14-brief.md addendum E9).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:?set TOTP_ENC_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      # Extra browser origins for the /ws Origin check (D70), e.g. the e2e host.
      WS_EXTRA_ORIGINS: ${WS_EXTRA_ORIGINS:-}
      LOG_LEVEL: info
      # How many worker processes the API forks (apps/api/src/cluster.ts).
      # A Node process is single-threaded, so before this the whole API was
      # capped at one core of the host's sixteen — measured, see
      # load/RESULTS.md. `1` restores the old single-process behaviour.
      #
      # 4, not `os.availableParallelism()`, because each worker opens its own
      # Postgres pool of 10 (`createDb`) and the `postgres` service above runs
      # stock `postgres:16` with `max_connections=100`: 4 workers is 40
      # connections, which leaves room for `judged`, `migrate` and a psql
      # session. Raise this only together with `max_connections`.
      API_WORKERS: ${API_WORKERS:-4}
      # Read, never acted on: the admin dashboard (D47) reports judged's
      # concurrency, and judged is a different container. The SAME compose
      # variable feeds both, so the number the dashboard shows is the number
      # judged actually runs — the API neither validates it nor forks on it,
      # and unset simply reads as "not told" on the dashboard.
      JUDGED_CONCURRENCY: ${JUDGED_CONCURRENCY:-1}
      # Task 13: content-addressed package bytes live here, behind a named
      # volume — without one, an uploaded/seeded package vanishes on the
      # next `podman-compose up` (a fresh container gets a fresh overlay
      # filesystem). apps/api/Dockerfile pre-creates and chowns this path so
      # the unprivileged `node` user can write to it on first use.
      PACKAGE_STORE_DIR: /var/lib/duckoj/packages
      # Statement PDFs (Phase 7b): the binary is baked into the image with
      # the mitex cache pre-seeded; unset this to turn the route back to 501.
      TYPST_BIN: /usr/local/bin/typst
      # Mail (D1, D57, F-40). Until F-40 this block did not exist: the
      # config module had read a full SMTP_* set since 3f and NONE of it
      # reached the container, so an operator could fill in every line of
      # `.env`, restart, and get the same silent no-op — with the reset link
      # for a locked-out teacher going to this log and nowhere else.
      #
      # All six are passed, and all six default to EMPTY rather than being
      # conditionally omitted, because compose cannot omit conditionally.
      # `SMTP_HOST=` is what an unconfigured stack hands the process, and
      # `unsetWhenBlank` in apps/api/src/config/config.schema.ts is what makes
      # that mean "no mail configured" instead of a boot crash on `.min(1)`.
      # Do not "tidy" these into literals: this file is committed, and
      # SMTP_PASSWORD is a credential. Values live in `.env` only.
      #
      # Empty SMTP_HOST is a legitimate configuration (development, and any
      # province that has not been given a relay yet) — it is not silent
      # about it: the API warns at boot naming this variable, `readyz`
      # reports `mail: "log"`, and the admin dashboard says so on screen.
      SMTP_HOST: ${SMTP_HOST:-}
      # Defaults (587, false, and the From address) belong to the schema, not
      # to a `${VAR:-default}` here — one place for each, so the deployment
      # cannot disagree with the code about what unset means.
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - package_store:/var/lib/duckoj/packages
    # This condition is correct per the Compose spec and is left in place for
    # tools that honor it, but podman-compose 1.5 does NOT reliably enforce it:
    # `api` was observed, by container timestamp, to start before `migrate`
    # had even run under a bare `up -d` (see docs/runbook.md for the
    # measurements). The most likely mechanism — consistent with an isolated
    # test but not traced through podman-compose's source — is that it
    # pre-creates every service's container before starting any of them, and
    # `podman wait --condition=stopped` on a container that was only ever
    # *created* (never started) returns success immediately instead of
    # blocking. Whatever the exact cause, don't rely on `up -d` alone to gate
    # `api` on `migrate` under podman-compose — use `scripts/compose-up.sh`,
    # documented in docs/runbook.md.
    depends_on:
      migrate: { condition: service_completed_successfully }
    # D86. This must be answered BY A WORKER, not merely accepted by the
    # primary's port bind. `node:cluster` has the primary bind the socket and
    # hand connections to workers, so on 2026-08-30 — every worker dead, the
    # primary alive — the old probe (`r.ok`, no body, no timeout, no catch)
    # opened a connection that was accepted and never answered: it did not
    # fail, it hung for its whole 5 s timeout, six times, while `podman ps`
    # reported the container `Up`.
    #
    # Three things fix that, and all three are load-bearing:
    #   - `r.json()` — the body only exists if a route ran, which only a
    #     worker can do. A port that accepts and says nothing cannot produce it.
    #   - `b.workers >= 1` — the live worker count the primary broadcasts
    #     (apps/api/src/worker-count.ts). Also fails closed against an image
    #     old enough not to send the field at all.
    #   - `AbortSignal.timeout(4000)` and the `.catch` — so a hang is a
    #     FAILED probe at 4 s rather than a probe killed by compose at 5 s
    #     with no exit status of its own.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>r.ok?r.json():Promise.reject(new Error('status '+r.status))).then(b=>process.exit(b&&b.status==='ok'&&b.workers>=1?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  judged:
    build: { context: ., dockerfile: apps/judged/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://duckoj:${POSTGRES_PASSWORD}@postgres:5432/duckoj
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: info
      # apps/judged/src/config.ts defaults AGENT_ORIGIN to
      # http://judge-agent:3002, which presumes a same-named service that
      # does not exist here — per task-13-brief.md's Controller addendum
      # C2, judge-agent runs inside the `judge` service's own container
      # (judge/entrypoint.sh), so the reachable hostname on this Compose
      # network is the `judge` service itself, on the port judge-agent
      # actually listens on (AGENT_PORT below, on the `judge` service).
      AGENT_ORIGIN: http://judge:3002
      # How many independent claim loops judged runs (apps/judged/src/worker.ts,
      # `startWorkerPool`). One loop per `judge` container, and a plain `up`
      # starts one. A DMOJ judge grades one submission per connection, and a
      # loop reserves a judge slot before it claims, so a second loop against
      # this single judge would never win one — raise this to 2 only together
      # with the `judge-2` service below (`--profile scale`), which is the
      # sequencing docs/runbook.md "Judging throughput" prescribes (D29, D68).
      JUDGED_CONCURRENCY: ${JUDGED_CONCURRENCY:-1}
    # The judge dials OUT to judged (see the `judge` service below) — judged
    # needs no ingress at all. Do NOT publish 9999 (or 3001) to the host:
    # BridgeServer now verifies every handshake's `(id, key)` against
    # `judge_nodes` (apps/judged/src/drivers/dmoj/bridge-server.ts,
    # `BridgeOptions.verifyJudge`), but network isolation on the Compose
    # network remains real defense in depth — keep it, don't "fix" this by
    # publishing the port.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  judge:
    build: { context: ., dockerfile: judge/Dockerfile }
    restart: unless-stopped
    environment:
      # judge-agent's own config (apps/judge-agent/src/config.ts) — the
      # agent runs inside this container (judge/entrypoint.sh, Task 13's
      # Controller addendum C2), so these reach it directly via the
      # process environment; no separate service, no shared volume.
      API_ORIGIN: http://api:3000
      JUDGE_NAME: judge-1
      # Must match the same var scripts/seed-problem.ts hashes into
      # judge_nodes, and what judge/judge.yml's template renders as its
      # `key` — see .env.example's JUDGE_TOKEN and task-13-brief.md's
      # Controller addendum C1 ("three consumers, one token").
      JUDGE_TOKEN: ${JUDGE_TOKEN:?set JUDGE_TOKEN}
      PROBLEMS_DIR: /problems
      AGENT_PORT: '3002'
    # judge-agent's own /healthz, not the dmoj judge process (which has none
    # to poll) — this is what scripts/compose-up.sh's wait_healthy waits on
    # (Controller addendum C3: the shape that fails on timeout whether or
    # not the container was ever found, not wait_running's). Do NOT publish
    # this port to the host (Controller addendum C4) — nothing outside the
    # Compose network has business reaching it.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002/healthz').then(r=>process.exit(r.ok?0:1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    # The judge dials out to judged; judged never dials in. judge-server
    # tolerates judged being briefly unreachable at boot (exponential
    # backoff: 4s, then 6s, then retry) so no service_healthy dependency is
    # needed here — see task-14-brief.md addendum E6.
    #
    # `run` is not a real dmoj subcommand — it's understood only by the
    # official DMOJ `.docker/entry` wrapper, which this image does not use
    # (its ENTRYPOINT is bare `tini --`). The port is a flag (`-p`), not a
    # positional — `dmoj judged 9999` would parse "9999" as judge_name, not
    # the port.
    #
    # --only-executors: the ALLOW-LIST of dmoj executors this judge loads and
    # therefore announces in its handshake. It is not decoration — it is the
    # single reason a judge whose image has carried g++ 12 and CPython 3.11
    # since day one announced exactly one executor for two weeks (F-39), and
    # `judged` dispatches on what a judge ANNOUNCES, so a language absent from
    # this list is a language whose submissions sit `queued` with D68's
    # blocked_reason forever.
    #
    # This list must stay a superset of the `executor_key`s that migration
    # 0042 puts in `language_driver_keys` for driver `dmoj`. It is widened
    # here, not removed, because the flag still earns its keep: without it the
    # judge self-tests every executor it ships, including OBJC, whose
    # self-test throws (objc_flags is unconfigured, so judge-server's own
    # OBJC.py does `None + list`) — harmless (the judge still comes online)
    # but it reads exactly like a broken judge in the startup log.
    #
    # Verified against the running image's own self-test: CPP03, CPP11,
    # CPP14, CPP17, CPP20, C, C11 and PY3 all pass. There is no CPP23 and,
    # notably, no C17 — `C` is -std=c99 and `C11` is -std=c11.
    command:
      [
        'dmoj',
        'judged',
        '-p',
        '9999',
        '-c',
        '/judge-config/judge.yml',
        '--only-executors',
        'CPP14,CPP17,CPP20,C11,PY3',
      ]
    # No bind mount for /problems: it is now a purely runtime, in-container
    # directory that judge-agent materialises packages into on demand
    # (apps/judge-agent/src/materializer.ts). Nothing here needs to persist
    # across a container recreate — materialisation is idempotent and
    # content-addressed, so a lost /problems is just re-fetched from the
    # API on the next dispatch, not a data-loss event. judge/Dockerfile
    # already creates and chowns it.
    #
    # judge.yml itself IS still a bind mount, but of the template
    # (judge/judge.yml), read-only — the real, credential-bearing
    # judge-config/judge.yml is rendered fresh into the container's own
    # filesystem at every start (judge/entrypoint.sh), never checked in and
    # never baked into the image.
    volumes:
      - ./judge/judge.yml:/judge-config/judge.yml.template:ro

  # A second judge, off by default: `profiles` keeps it out of a plain
  # `up`, and it starts only under `--profile scale` (docs/runbook.md,
  # "Adding a second judge"). Behind a profile rather than commented out so
  # it is a service Compose validates and can actually start, not a block
  # of text that rots — and off by default because starting it without its
  # `judge_nodes` row (`corepack pnpm judge:node add judge-2`) produces a
  # container that handshakes, is refused, and retries forever.
  #
  # Everything but the identity is copied from `judge` deliberately: same
  # image, same read-only template mount (judge.yml is rendered per
  # container from that container's own env), same absence of published
  # ports, no volume of its own. `/problems` is a per-container runtime
  # directory judge-agent materialises into on demand, so this judge seeds
  # nothing and shares nothing — it re-fetches from the API what it needs.
  #
  # `judged` needs no configuration to use it: the bridge accepts any
  # handshake that verifies, and `DmojDriver` picks an idle connection that
  # can run the job's language (D68). Raise `JUDGED_CONCURRENCY` to 2 in
  # `.env` to give the second judge a claim loop of its own — until you do,
  # one loop feeds one judge and the other idles (D29).
  judge-2:
    profiles: ['scale']
    build: { context: ., dockerfile: judge/Dockerfile }
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:3000
      JUDGE_NAME: judge-2
      # A DIFFERENT token, not a second copy of JUDGE_TOKEN: `judge_nodes`
      # has a UNIQUE index on `token_hash` (`judge_nodes_token_idx`), so two
      # nodes cannot share one. `corepack pnpm judge:node add judge-2`
      # prints the value to put here — do not invent one by hand, and do not
      # reuse judge-1's.
      #
      # A placeholder default, NOT `${JUDGE_TOKEN_2:?...}`, and this is
      # load-bearing: podman-compose 1.5 interpolates the whole file before
      # it filters services by profile (`_resolve_profiles`, called after
      # normalisation), so a required-variable marker here fails every plain
      # `up` of the default stack — for a service that plain `up` does not
      # even start. Verified with `podman-compose config`. The placeholder
      # cannot verify against any `judge_nodes` row, so forgetting to set it
      # surfaces as one greppable line in judged's log ("judge handshake
      # rejected", id `judge-2`) rather than as a judge that silently grades
      # nothing.
      JUDGE_TOKEN: ${JUDGE_TOKEN_2:-JUDGE_TOKEN_2-is-unset-see-runbook}
      PROBLEMS_DIR: /problems
      AGENT_PORT: '3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002/healthz').then(r=>process.exit(r.ok?0:1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    command:
      [
        'dmoj',
        'judged',
        '-p',
        '9999',
        '-c',
        '/judge-config/judge.yml',
        '--only-executors',
        'CPP14,CPP17,CPP20,C11,PY3',
      ]
    volumes:
      - ./judge/judge.yml:/judge-config/judge.yml.template:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    # Rootless Podman cannot bind privileged host ports (<1024) without extra
    # host configuration, so map to high ports instead of running as root.
    # Caddy inside the container still listens on 80/443 (see Caddyfile).
    ports: ['8080:80', '8443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv/web:ro
      - caddydata:/data
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  caddydata:
  package_store:
