# Runbook note: Caddy serves ./apps/web/dist as a bind mount (read-only). Build the
# SPA before bringing the stack up, or Caddy will serve an empty/missing directory:
#   corepack pnpm --filter @qhhoj/web exec vite build
#
# MinIO is intentionally not defined here — it arrives in Phase 2.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qhhoj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: qhhoj
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qhhoj']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    # Invoke the already-installed tsx binary directly, bypassing pnpm/corepack.
    # The `deps`/`build` stages run as root, so any corepack cache they populate
    # lives under /root and is never carried into the runtime image; the `node`
    # user has a different $HOME regardless. Going through `pnpm` here would make
    # every migrate-container start reach out to the npm registry to re-fetch the
    # pinned pnpm version. This path has no such dependency — verified with
    # `podman run --network none` (see task-15-report.md).
    command: ['packages/db/node_modules/.bin/tsx', 'scripts/migrate.ts']
    environment:
      DATABASE_URL: postgres://qhhoj:${POSTGRES_PASSWORD}@postgres:5432/qhhoj
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://qhhoj:${POSTGRES_PASSWORD}@postgres:5432/qhhoj
      # Required since Task 11 (the WebSocket gateway's Redis subscriber needs
      # it) — this was a known, deliberately-deferred gap until this task
      # added the `redis` service (see task-14-brief.md addendum E9).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:?set TOTP_ENC_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      LOG_LEVEL: info
    # This condition is correct per the Compose spec and is left in place for
    # tools that honor it, but podman-compose 1.5 does NOT reliably enforce it:
    # `api` was observed, by container timestamp, to start before `migrate`
    # had even run under a bare `up -d` (see docs/runbook.md for the
    # measurements). The most likely mechanism — consistent with an isolated
    # test but not traced through podman-compose's source — is that it
    # pre-creates every service's container before starting any of them, and
    # `podman wait --condition=stopped` on a container that was only ever
    # *created* (never started) returns success immediately instead of
    # blocking. Whatever the exact cause, don't rely on `up -d` alone to gate
    # `api` on `migrate` under podman-compose — use `scripts/compose-up.sh`,
    # documented in docs/runbook.md.
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  judged:
    build: { context: ., dockerfile: apps/judged/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://qhhoj:${POSTGRES_PASSWORD}@postgres:5432/qhhoj
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: info
    # The judge dials OUT to judged (see the `judge` service below) — judged
    # needs no ingress at all. Do NOT publish 9999 (or 3001) to the host: our
    # BridgeServer accepts any handshake and never checks the judge key
    # (apps/judged/src/drivers/dmoj/bridge-server.ts:73-76), so anything that
    # can reach 9999 could register as a judge and be handed submission
    # source. Network isolation on the Compose network is the only control —
    # keep it, don't "fix" this by publishing the port.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  judge:
    build: { context: ., dockerfile: judge/Dockerfile }
    restart: unless-stopped
    # The judge dials out to judged; judged never dials in. judge-server
    # tolerates judged being briefly unreachable at boot (exponential
    # backoff: 4s, then 6s, then retry) so no service_healthy dependency is
    # needed here — see task-14-brief.md addendum E6.
    #
    # `run` is not a real dmoj subcommand — it's understood only by the
    # official DMOJ `.docker/entry` wrapper, which this image does not use
    # (its ENTRYPOINT is bare `tini --`). The port is a flag (`-p`), not a
    # positional — `dmoj judged 9999` would parse "9999" as judge_name, not
    # the port.
    #
    # --only-executors CPP17: phase 1 is C++-only by decision — the web UI
    # offers only ['cpp17'], DmojDriver.capabilities() declares only
    # ['cpp17'], and the only language mapping that reaches a real dmoj
    # executor is cpp17 -> CPP17. Without this flag the judge self-tests
    # every executor it ships, including OBJC, whose self-test throws
    # (objc_flags is unconfigured, so judge-server's own OBJC.py does
    # `None + list`) — harmless (the judge still comes online) but it reads
    # exactly like a broken judge in the startup log. Loading only the
    # executor we actually dispatch to removes that noise instead of
    # explaining it away.
    command: ['dmoj', 'judged', '-p', '9999', '-c', '/judge.yml', '--only-executors', 'CPP17']
    volumes:
      - ./problems:/problems:ro
      - ./judge/judge.yml:/judge.yml:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    # Rootless Podman cannot bind privileged host ports (<1024) without extra
    # host configuration, so map to high ports instead of running as root.
    # Caddy inside the container still listens on 80/443 (see Caddyfile).
    ports: ['8080:80', '8443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv/web:ro
      - caddydata:/data
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  caddydata:
