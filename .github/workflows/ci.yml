name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose. The action reads `packageManager` from
      # package.json ("pnpm@9.12.0") and errors out when an explicit `version`
      # disagrees with it as a string — `9` and `9.12.0` do not match. Leaving
      # it out makes `packageManager` the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test
        env:
          # Testcontainers uses the Docker daemon preinstalled on the runner.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Verify OpenAPI and SDK are up to date
        run: |
          pnpm --filter @qhhoj/contracts openapi
          pnpm --filter @qhhoj/sdk exec openapi-typescript ../../openapi.json -o src/generated.ts
          git diff --exit-code -- openapi.json packages/sdk/src/generated.ts

      - name: Build
        run: pnpm --filter @qhhoj/web exec vite build
